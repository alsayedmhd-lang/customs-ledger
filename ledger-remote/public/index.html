<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledger Remote</title><link rel="icon" type="image/svg+xml" href="/icons/ledger-remote.svg"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/icons/ledger-remote-192.png"><link rel="stylesheet" href="/style.css?v=0.8.5"><link rel="stylesheet" href="/company-brand.css"><link rel="stylesheet" href="/invoice-desktop.css"><link rel="stylesheet" href="/receipt-print.css"><link rel="stylesheet" href="/remote-pages.css"><link rel="stylesheet" href="/editor-pages.css"><link rel="stylesheet" href="/compact-ui.css?v=0.8.13"><body><header><button id="menu-toggle" type="button" hidden aria-controls="remote-sidebar" aria-expanded="false">☰</button><strong>Ledger <span>Remote</span></strong><button id="lang">English</button></header><div id="notice"></div><main><section id="login"><h1>الدخول / Sign in</h1><p hidden></p><form><label>المستخدم / Username<input name="username" autocomplete="username" required></label><label>كلمة المرور / Password<input name="password" type="password" autocomplete="current-password" required></label><button>دخول / Sign in</button></form></section><section id="otp-login" hidden><h1 id="otp-title"></h1><p id="otp-description"></p><p id="otp-fallback" hidden><span id="otp-fallback-label"></span> <strong id="otp-visible-code" dir="ltr"></strong></p><form id="otp-form"><label><span id="otp-label"></span><input id="otp-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required dir="ltr"></label><button id="otp-submit" type="submit"></button></form><div class="otp-actions"><button id="otp-resend" type="button"></button><button id="otp-back" type="button"></button></div></section><section id="workspace"  hidden><aside id="remote-sidebar"><div class="sidebar-brand"><span class="brand-symbol">L</span><div><b>Le ="button">رجوع</button></div><form id="draft-form"><div id="invoice-fields"><section class="editor-card"><h3 data-editor-ar="البيانات الأساسية" data-editor-en="Basic details">البيانات الأساسية</h3><div id="invoice-basic" class="editor-grid"><label class="editor-wide">العميل<select id="draft-client" required></select></label><label>تاريخ الإصدار<input id="draft-date" type="date" lang="en" required></label><label>تاريخ الاستحقاق<input id="draft-due" type="date" lang="en"></label><label class="editor-wide">اسم المستورد / المصدر<input id="draft-importer" maxlength="200"></label><label>الحالة<select id="draft-status"></select></label><label>المندوب<select id="draft-salesman" required></select></label></div></section><section class="editor-card"><h3 data-editor-ar="بيانات الشحنة" data-editor-en="Shipment information">بيانات الشحنة</h3><div class="editor-grid"><label>رقم البيان<input id="draft-shipment" maxlength="100"></label><label>رقم البوليصة B/L<input id="draft-bill" maxlength="100"></label><label>ميناء الدخول<input id="draft-port" maxlength="100"></label><label>عدد الطرود<input id="draft-packages" type="number" min="0" max="2147483647" step="1"></label><label>الوزن (كجم)<input id="draft-weight" type="number" min="0" step="0.001"></label></div></section><section class="editor-card"><div class="editor-card-heading"><h3 data-editor-ar="بنود الفاتورة" data-editor-en="Invoice items">بنود الفاتورة</h3><button id="add-line" type="button">إضافة بند</button></div><div class="editor-items-scroll"><table class="editor-items"><thead><tr><th data-editor-ar="نموذج" data-editor-en="Template">نموذج</th><th data-editor-ar="الوصف" data-editor-en="Description">الوصف</th><th data-editor-ar="الكمية" data-editor-en="Quantity">الكمية</th><th data-editor-ar="سعر الوحدة" data-editor-en="Unit price">سعر الوحدة</th><th data-editor-ar="الإجمالي" data-editor-en="Total">الإجمالي</th><th></th></tr></thead><tbody id="draft-lines"></tbody></table></div></section></div><div id="receipt-fields" hidden><section class="editor-card"><h3 data-editor-ar="بيانات سند القبض" data-editor-en="Receipt details">بيانات سند القبض</h3><div id="receipt-basic" class="editor-grid"><label class="editor-wide">الفاتورة<select id="draft-invoice"></select></label><label>المبلغ (ر.ق)<input id="draft-amount" type="number" min="0.01" step="0.01"></label><label>طريقة الدفع<select id="draft-payment"><option value="cash">نقدًا</option><option value="bank_transfer">تحويل بنكي</option><option value="cheque">شيك</option></select></label></div></section></div><div id="editor-footer"><section id="draft-notes-card" class="editor-card"><label>ملاحظات<textarea id="draft-notes" maxlength="2000" rows="5"></textarea></label></section><section id="invoice-summary" class="editor-card"><div class="editor-grid"><label>الضريبة %<input id="draft-tax" type="number" min="0" max="100" step="0.01" value="0"></label><label>دفعة مقدمة<input id="draft-advance" type="number" min="0" step="0.01" value="0"></label></div><div id="draft-totals" class="editor-totals"></div></section></div><p id="draft-error" role="status"></p><div id="draft-actions" class="editor-actions"><button id="save-draft" type="submit" form="draft-form">حفظ</button><button id="cancel-draft" type="button">إلغاء</button></div></form></section><section id="invoice-dialog" hidden><div class="invoice-controls"><button id="close-invoice" type="button">إغلاق / Close</button><button id="print-invoice" type="button" disabled>طباعة / PDF</button><label><input id="invoice-stamp" type="checkbox" checked> الختم / Stamp</label><label><input id="invoice-signatures" type="checkbox"> التوقيعات / Signatures</label><span id="invoice-print-notice"></span></div><div id="invoice-paper"></div></section><script src="/notifications.js?v=0.8.5"></script><script src="/invoice-ui.js" defer></script><script src="/draft-ui.js" defer></script><script src="/ui-language.js?v=0.8.8"></script><script src="/master-data-ui.js"></script><script src="/receipt-print-ui.js"></script><script src="/company-brand.js"></script><script src="/company-settings-ui.js?v=0.8.17"></script><script src="/remote-pages.js?v=0.8.14"></script><script src="/editor-pages.js"></script><script src="/accounting-ui.js"></script><script src="/app.js?v=0.8.10"></script><script src="/otp-ui.js?v=0.8.10"></script><script src="/trash-ui.js"></script></body></html>
